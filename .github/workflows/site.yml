name: 대시보드 갱신

on:
  schedule:
    - cron: "30 22 * * *"   # 매일 07:30 (한국시간) — 전날 미국 종가 반영
  workflow_dispatch:        # Actions 탭 'Run workflow'로 즉시 갱신
  push:
    branches: [main]
    paths: ["settings.json", "site_template.html", "build_site.py", "core/**"]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 패키지 설치
        run: |
          pip install pandas numpy yfinance requests cryptography
          mkdir -p vendor
          npm pack chart.js@4.4.1 --silent
          tar xzf chart.js-4.4.1.tgz
          cp package/dist/chart.umd.js vendor/chart.umd.js
      - name: 신호 계산 및 페이지 생성
        env:
          SITE_PASSWORD: ${{ secrets.SITE_PASSWORD }}
        run: python build_site.py
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.d.outputs.page_url }}
    steps:
      - id: d
        uses: actions/deploy-pages@v4

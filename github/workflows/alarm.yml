name: 투자알람 메일

on:
  schedule:
    - cron: "30 22 * * *"   # 매일 07:30 (한국시간) = 22:30 UTC
  workflow_dispatch:        # Actions 탭에서 'Run workflow'로 바로 실행 가능

permissions:
  contents: write           # 알람 발송 기록(data/state.json)을 저장소에 저장

concurrency:
  group: alarm
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: 패키지 설치
        run: pip install -r requirements.txt

      - name: 신호 확인 및 메일 발송
        env:
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          APP_URL: ${{ vars.APP_URL }}
        run: python job.py

      - name: 발송 기록 저장
        if: always()
        run: |
          git config user.name "invest-alarm-bot"
          git config user.email "invest-alarm-bot@users.noreply.github.com"
          git add data/state.json data/fear_greed.csv 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "변경 없음"
          else
            git commit -m "알람 상태 갱신 $(date -u +%F)"
            git push
          fi
